<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number to Nepali Words</title>
  <meta name="menu-title" content="Number to Nepali words">
  <meta name="description" content="Type a number and get it written in Nepali words (अंकमा शब्द).">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="/">Nepali Utilities</a>
      <nav id="menu" aria-label="Tools"></nav>
    </div>
  </header>

  <main>
    <h1>Number to Nepali words</h1>
    <p class="lead">Type a number in English or Nepali digits. Works up to 19 digits, with decimals.</p>

    <label for="num">Number / संख्या</label>
    <input id="num" type="text" inputmode="decimal" autocomplete="off" placeholder="1234567" autofocus>
    <p id="hint" class="hint" aria-live="polite"></p>

    <section class="result" aria-live="polite">
      <p id="digits" class="digits"></p>
      <p id="words" class="words" lang="ne"></p>
    </section>
    <button id="copy" type="button" disabled>Copy words</button>

    <p class="note">Some numbers have more than one accepted spelling in Nepali. This tool uses the common textbook forms.</p>
  </main>

  <script>
    const NEP = [
      "शून्य","एक","दुई","तीन","चार","पाँच","छ","सात","आठ","नौ",
      "दश","एघार","बाह्र","तेह्र","चौध","पन्ध्र","सोह्र","सत्र","अठार","उन्नाइस",
      "बीस","एक्काइस","बाइस","तेइस","चौबीस","पच्चीस","छब्बीस","सत्ताइस","अठ्ठाइस","उनन्तीस",
      "तीस","एकतीस","बत्तीस","तेत्तीस","चौँतीस","पैँतीस","छत्तीस","सतत्तीस","अठतीस","उनन्चालीस",
      "चालीस","एकचालीस","बयालीस","त्रिचालीस","चौवालीस","पैंतालीस","छयालीस","सतचालीस","अठचालीस","उनन्चास",
      "पचास","एकाउन्न","बाउन्न","त्रिपन्न","चौवन्न","पचपन्न","छपन्न","सन्तावन्न","अन्ठावन्न","उनान्साठी",
      "साठी","एकसट्ठी","बयसट्ठी","त्रिसट्ठी","चौसट्ठी","पैंसट्ठी","छयसट्ठी","सतसट्ठी","अठसट्ठी","उनन्सत्तरी",
      "सत्तरी","एकहत्तर","बहत्तर","त्रिहत्तर","चौहत्तर","पचहत्तर","छयहत्तर","सत्हत्तर","अठहत्तर","उनासी",
      "असी","एकासी","बयासी","त्रियासी","चौरासी","पचासी","छयासी","सतासी","अठासी","उनान्नब्बे",
      "नब्बे","एकानब्बे","बयानब्बे","त्रियानब्बे","चौरानब्बे","पन्चानब्बे","छयानब्बे","सन्तानब्बे","अन्ठानब्बे","उनान्सय"
    ];
    // After the last three digits, Nepali groups numbers in pairs of digits.
    const UNITS = ["हजार","लाख","करोड","अर्ब","खर्ब","नील","पद्म","शंख"];

    function below1000(n) {
      const h = Math.floor(n / 100), r = n % 100, out = [];
      if (h) out.push(NEP[h] + " सय");
      if (r) out.push(NEP[r]);
      return out.join(" ");
    }

    function toWords(big) {
      if (big === 0n) return NEP[0];
      const parts = [];
      const low = Number(big % 1000n);
      let rest = big / 1000n;
      if (low) parts.push(below1000(low));
      for (const unit of UNITS) {
        if (rest === 0n) break;
        const g = Number(rest % 100n);
        rest /= 100n;
        if (g) parts.unshift(NEP[g] + " " + unit);
      }
      return parts.join(" ");
    }

    // 1234567 -> 12,34,567
    function groupNepali(s) {
      if (s.length <= 3) return s;
      const head = s.slice(0, -3), tail = s.slice(-3);
      return head.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + tail;
    }

    const $ = (id) => document.getElementById(id);
    const input = $("num"), hint = $("hint"), digitsEl = $("digits"), wordsEl = $("words"), copyBtn = $("copy");

    function update() {
      hint.textContent = ""; hint.classList.remove("error");
      digitsEl.textContent = ""; wordsEl.textContent = ""; copyBtn.disabled = true;

      let v = input.value
        .replace(/[०-९]/g, (d) => "०१२३४५६७८९".indexOf(d))
        .replace(/[,\s]/g, "");
      if (!v) return;

      const m = v.match(/^(-)?(\d+)(?:\.(\d+))?$/);
      if (!m) { hint.textContent = "Enter digits only, for example 250000 or 1,250.75"; hint.classList.add("error"); return; }

      const [, neg, whole, frac] = m;
      const trimmed = whole.replace(/^0+(?=\d)/, "");
      if (trimmed.length > 19) { hint.textContent = "Too large. Use 19 digits or fewer."; hint.classList.add("error"); return; }
      if (frac && frac.length > 15) { hint.textContent = "Use 15 decimal digits or fewer."; hint.classList.add("error"); return; }

      let words = toWords(BigInt(trimmed));
      if (frac) words += " दशमलव " + [...frac].map((d) => NEP[+d]).join(" ");
      if (neg) words = "ऋण " + words;

      digitsEl.textContent = (neg ? "-" : "") + groupNepali(trimmed) + (frac ? "." + frac : "");
      wordsEl.textContent = words;
      copyBtn.disabled = false;
    }

    input.addEventListener("input", update);
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(wordsEl.textContent);
        copyBtn.textContent = "Copied";
      } catch (e) {
        copyBtn.textContent = "Copy failed";
      }
      setTimeout(() => (copyBtn.textContent = "Copy words"), 1500);
    });
  </script>
  <script src="/assets/menu.js" defer></script>
</body>
</html>
